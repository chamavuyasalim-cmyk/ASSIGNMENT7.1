<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Navigation Bar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <a href="#" class="logo">MyWebsite</a>

        <nav>
            <ul class="nav-links">
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#services">Services</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>

        <a href="#contact" class="nav-button">Get Started</a>
    </header>

    <main>
        <section id="home">
            <h1>Welcome to MyWebsite</h1>
            <p>This is a responsive navigation bar created using Flexbox.</p>
        </section>

        <section id="about">
            <h2>About</h2>
            <p>Learn more about our website.</p>
        </section>

        <section id="services">
            <h2>Services</h2>
            <p>Explore the services we offer.</p>
        </section>

        <section id="contact">
            <h2>Contact</h2>
            <p>Get in touch with us.</p>
        </section>
    </main>

</body>
</html>
